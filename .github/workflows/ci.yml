name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check documentation
        run: cargo doc --no-deps --all-features

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Unit and integration tests
        run: cargo test --workspace

      - name: Tests (release)
        run: cargo test --workspace --release

  regression:
    name: Perft and bench regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Deep perft
        run: cargo test -p movegen --test perft_deep --release -- --ignored --nocapture

      # The bench node count is the search regression signal, so it is pinned.
      #
      # It is the same on every machine, not just on this runner, because bench
      # is depth-limited (nothing reads the clock), single-threaded, and integer
      # throughout (no float, so no rounding differences between CPUs). A faster
      # CPU changes NPS, not which nodes get searched.
      #
      # Three changes would break that and make this gate flaky rather than
      # wrong: a time-based cutoff reachable from a fixed-depth search, parallel
      # search, or a floating-point evaluation. If this job starts failing with
      # no search change, check for those first.
      - name: Bench node count
        env:
          EXPECTED_BENCH_NODES: "6383074"
        run: |
          cargo build --release --bin aether
          ACTUAL=$(./target/release/aether bench | awk '/^Nodes:/ {print $2; exit}')
          echo "expected=$EXPECTED_BENCH_NODES actual=$ACTUAL"
          if [ "$EXPECTED_BENCH_NODES" != "$ACTUAL" ]; then
            echo "::error::bench node count changed: $EXPECTED_BENCH_NODES -> $ACTUAL"
            echo "Deliberate search change? Update EXPECTED_BENCH_NODES in this file."
            echo "Otherwise something altered the search tree unintentionally."
            exit 1
          fi
