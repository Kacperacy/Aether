[package]
name = "aether"
version = "0.1.0"
authors = ["Kacper Maciołek"]
repository = "https://github.com/Kacperacy/Aether"
edition = "2024"

[dependencies]
interface = { workspace = true }

[workspace]
members = [
    "core",
    "attacks",
    "board",
    "movegen",
    "engine",
    "interface",
]

[workspace.dependencies]
# External dependencies
# Pinned exactly: rand/rand_chacha are mid-release-candidate and the
# rc.5 + 0.10.0 combination pulls an incompatible rand_core.
rand = "=0.10.0-rc.5"
rand_chacha = "=0.10.0-rc.1"
thiserror = "2.0.17"

# Workspace members as dependencies
aether-core = { path = "./core" }
attacks = { path = "./attacks" }
board = { path = "./board" }
movegen = { path = "./movegen" }
engine = { path = "./engine" }
interface = { path = "./interface" }

[lints]
workspace = true

[workspace.lints.clippy]
all = "warn"
pedantic = "allow"
nursery = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-native]
inherits = "release"
# Use with: RUSTFLAGS="-C target-cpu=native" cargo build --profile release-native
